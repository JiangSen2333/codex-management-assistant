name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "main"
      tag:
        description: "Release tag. Leave empty to use package.json version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi

          version="$(node -p "require('./package.json').version")"
          if [[ "${tag#v}" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${version}."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: metadata
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    env:
      MAC_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Neutralino binaries
        run: npm run neutralino:update

      - name: Download bundled Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node -p 'process.versions.node')"
          archive="node-v${node_version}-darwin-${MAC_ARCH}"
          archive_path="${RUNNER_TEMP}/${archive}.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://nodejs.org/dist/v${node_version}/${archive}.tar.gz" \
            --output "${archive_path}"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}"
          echo "NODE_RUNTIME_DARWIN=${RUNNER_TEMP}/${archive}/bin/node" >> "$GITHUB_ENV"

      - name: Build release archive
        run: npm run neutralino:release:mac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-management-assistant-${{ needs.metadata.outputs.tag }}-mac-${{ matrix.arch }}
          path: |
            dist/codex-management-assistant-mac-${{ matrix.arch }}-*.zip
            dist/codex-management-assistant-mac-${{ matrix.arch }}-*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codex-management-assistant-${{ needs.metadata.outputs.tag }}-mac-*
          path: dist
          merge-multiple: true

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/codex-management-assistant-mac-*.zip
            dist/codex-management-assistant-mac-*.dmg
