<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 管理助手</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f8;
        --panel: #ffffff;
        --ink: #202126;
        --muted: #71727c;
        --subtle: #8d8e98;
        --line: #e5e5ea;
        --accent: #635bff;
        --accent-dark: #4e46e8;
        --soft: #f0efff;
        --shadow: 0 10px 30px rgba(40, 36, 61, 0.07);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(460px, calc(100vw - 48px));
        display: grid;
        gap: 16px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        display: block;
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
      }

      .brand-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .subtitle {
        color: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0;
      }

      button {
        justify-self: start;
        min-height: 32px;
        border: 0;
        border-radius: 7px;
        padding: 0 12px;
        color: #fff;
        background: var(--accent);
        font: inherit;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="app-icon.png" alt="" />
        <div class="brand-copy">
          <h1>Codex 管理助手</h1>
          <p class="subtitle">MANAGEMENT ASSISTANT</p>
        </div>
      </div>
      <p id="status">正在启动本地管理服务... / Starting local manager...</p>
      <button id="retryButton" type="button" hidden>重新打开 / Retry</button>
    </main>

    <script>
      const expectedVersion = "0.1.6";
      const portStart = 47835;
      const portEnd = 47855;
      const statusElement = document.querySelector("#status");
      const retryButton = document.querySelector("#retryButton");

      function compareVersions(left, right) {
        const a = String(left || "0.0.0").replace(/^v/i, "").split(/[.-]/).map((part) => Number.parseInt(part, 10) || 0);
        const b = String(right || "0.0.0").replace(/^v/i, "").split(/[.-]/).map((part) => Number.parseInt(part, 10) || 0);
        const length = Math.max(a.length, b.length);

        for (let index = 0; index < length; index += 1) {
          const delta = (a[index] || 0) - (b[index] || 0);
          if (delta) return Math.sign(delta);
        }

        return 0;
      }

      async function probeManager(port) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 450);

        try {
          const response = await fetch(`http://127.0.0.1:${port}/api/health?t=${Date.now()}`, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) return null;
          const health = await response.json();
          if (health.name !== "Codex Management Assistant") return null;
          return { ...health, port };
        } catch {
          return null;
        } finally {
          window.clearTimeout(timeout);
        }
      }

      async function findManager() {
        let newestManager = null;

        for (let port = portStart; port <= portEnd; port += 1) {
          const manager = await probeManager(port);
          if (!manager) continue;
          if (manager.version === expectedVersion) return manager;
          if (!newestManager || compareVersions(manager.version, newestManager.version) > 0) {
            newestManager = manager;
          }
        }

        if (newestManager && compareVersions(newestManager.version, expectedVersion) > 0) {
          return newestManager;
        }

        return null;
      }

      async function openManager() {
        statusElement.textContent = "正在查找本地管理服务... / Finding local manager...";
        const manager = await findManager();
        if (!manager) {
          statusElement.textContent = "本地管理服务仍在启动，请稍后重试。 / The local manager is still starting. Try again shortly.";
          retryButton.hidden = false;
          return;
        }

        statusElement.textContent = "正在打开管理界面... / Opening manager...";
        window.location.replace(`http://127.0.0.1:${manager.port}/`);
      }

      retryButton.addEventListener("click", openManager);
      window.setTimeout(() => {
        retryButton.hidden = false;
        statusElement.textContent = "如果页面没有自动打开，请点击重新打开。 / If it does not open automatically, click retry.";
      }, 3000);

      openManager();
    </script>
  </body>
</html>
