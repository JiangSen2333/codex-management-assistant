<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 管理助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f6f4ef;
        color: #171717;
      }

      main {
        width: min(480px, calc(100vw - 48px));
        display: grid;
        gap: 14px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #6c6a64;
        line-height: 1.6;
      }

      .subtitle {
        color: #19715d;
        font-weight: 700;
      }

      button {
        justify-self: center;
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 18px;
        color: #fff;
        background: #19715d;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex 管理助手</h1>
      <p class="subtitle">Codex Management Assistant</p>
      <p id="status">正在启动本地管理服务... / Starting local manager...</p>
      <button id="retryButton" type="button" hidden>重新打开 / Retry</button>
    </main>

    <script>
      const targetUrl = "http://127.0.0.1:47835/";
      const statusElement = document.querySelector("#status");
      const retryButton = document.querySelector("#retryButton");

      function openManager() {
        statusElement.textContent = "正在打开管理界面... / Opening manager...";
        window.setTimeout(() => {
          window.location.replace(targetUrl);
        }, 900);
      }

      retryButton.addEventListener("click", openManager);
      window.setTimeout(() => {
        retryButton.hidden = false;
        statusElement.textContent = "如果页面没有自动打开，请点击重新打开。 / If it does not open automatically, click retry.";
      }, 3000);

      openManager();
    </script>
  </body>
</html>
